<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Habla">
  <meta name="theme-color" content="#4fbf26">
  <meta name="description" content="Learn Spanish with bite-sized lessons, streaks and XP">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Habla</title>
  <style>
    :root {
      --green: #4fbf26; --green-d: #3d9a1b;
      --blue: #2aa7e8; --blue-d: #1a86bf;
      --purple: #a465f0; --purple-d: #8248cc;
      --orange: #ff9a2e; --orange-d: #e07a10;
      --red: #ef4b4b; --red-d: #c43232;
      --gold: #ffc414; --gold-d: #e0a400;
      --bg: #ffffff; --surface-2: #f6f7f8;
      --border: #e3e5e8; --border-d: #cfd3d8;
      --text: #3a3f45; --muted: #8a9099;
      --ok-bg: #dff5cf; --ok-text: #3a8f12;
      --bad-bg: #ffe1e1; --bad-text: #d23b3b;
      --locked: #e3e5e8; --locked-d: #c8ccd1;
      --sel-bg: #ddf2fd; --sel-border: #84d0f7;
      --nav-h: 64px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131f24; --surface-2: #1c2b33;
        --border: #2c3c45; --border-d: #22323a;
        --text: #eef2f4; --muted: #8fa0a9;
        --ok-bg: #1f3a1a; --ok-text: #7fdc4f;
        --bad-bg: #3e1d1f; --bad-text: #ff7b7b;
        --locked: #33444d; --locked-d: #26353d;
        --sel-bg: #193a4d; --sel-border: #2aa7e8;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); height: 100%; }
    body {
      font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
      user-select: none; -webkit-user-select: none;
    }
    input { user-select: text; -webkit-user-select: text; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .hidden { display: none !important; }
    .screen { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }

    /* Chunky buttons */
    .btn {
      display: block; width: 100%;
      padding: 14px 16px; border-radius: 16px;
      font-weight: 800; font-size: 1rem; letter-spacing: 0.06em; text-transform: uppercase;
      background: var(--c, var(--green)); color: #fff;
      box-shadow: 0 4px 0 var(--cd, var(--green-d));
      transition: transform .05s, box-shadow .05s, filter .1s;
    }
    .btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--cd, var(--green-d)); }
    .btn:disabled { background: var(--locked); color: var(--muted); box-shadow: 0 4px 0 var(--locked-d); cursor: default; }
    .btn.ghost { background: transparent; color: var(--blue); box-shadow: none; border: 2px solid var(--border); box-shadow: 0 4px 0 var(--border); }
    .btn.red { --c: var(--red); --cd: var(--red-d); }
    .btn.blue { --c: var(--blue); --cd: var(--blue-d); }
    .btn.text { background: none; box-shadow: none; color: var(--blue); }
    .btn + .btn { margin-top: 12px; }

    /* Top bar */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
      border-bottom: 2px solid var(--border);
      background: var(--bg); z-index: 5;
    }
    .stat { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 1.05rem; padding: 4px 6px; border-radius: 10px; }
    .stat .ico { font-size: 1.3rem; line-height: 1; }
    .stat.streak { color: var(--orange); }
    .stat.streak.off { color: var(--muted); }
    .stat.streak.off .ico { filter: grayscale(1); opacity: .6; }
    .stat.gems { color: var(--blue); }
    .stat.hearts { color: var(--red); }
    .flag { font-size: 1.6rem; line-height: 1; padding: 2px 4px; }

    .tab-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .wrap { max-width: 520px; margin: 0 auto; padding: 16px 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom)); }

    .nav {
      position: absolute; left: 0; right: 0; bottom: 0;
      display: flex; justify-content: space-around;
      border-top: 2px solid var(--border); background: var(--bg);
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    }
    .nav button { flex: 1; max-width: 90px; padding: 6px 0; border-radius: 12px; border: 2px solid transparent; font-size: 1.6rem; line-height: 1; }
    .nav button span { display: block; font-size: 0.65rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
    .nav button.on { background: var(--sel-bg); border-color: var(--sel-border); }
    .nav button.on span { color: var(--blue); }

    /* Daily goal card */
    .card { border: 2px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-bottom: 16px; }
    .card h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 8px; }
    .card p { color: var(--muted); font-size: 0.92rem; }
    .goal-row { display: flex; align-items: center; gap: 12px; }
    .bar { flex: 1; height: 16px; background: var(--locked); border-radius: 99px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .4s; position: relative; }
    .bar > i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 3px; height: 4px; border-radius: 9px; background: rgba(255,255,255,.35); }
    .goal-num { font-weight: 800; color: var(--muted); font-size: .9rem; white-space: nowrap; }

    /* Learning path */
    .unit { margin-bottom: 28px; position: relative; }
    .unit-banner {
      background: var(--c); color: #fff; border-radius: 16px; padding: 14px 16px;
      box-shadow: 0 4px 0 var(--cd); margin-bottom: 64px;
    }
    .unit-banner small { font-weight: 800; letter-spacing: .06em; opacity: .85; font-size: .75rem; text-transform: uppercase; }
    .unit-banner h2 { font-size: 1.3rem; font-weight: 800; margin: 2px 0; }
    .unit-banner p { font-size: .9rem; opacity: .95; }
    .path { display: flex; flex-direction: column; align-items: center; gap: 18px; position: relative; }
    .node-wrap { position: relative; }
    .node {
      width: 72px; height: 66px; border-radius: 50%;
      background: var(--c); box-shadow: 0 7px 0 var(--cd);
      font-size: 1.9rem; display: grid; place-items: center; color: #fff;
      transition: transform .05s, box-shadow .05s;
    }
    .node:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--cd); }
    .node.locked { --c: var(--locked); --cd: var(--locked-d); filter: grayscale(1); }
    .node.locked > * { opacity: .45; }
    .node.done::after { content: "✓"; position: absolute; right: -6px; top: -6px; width: 24px; height: 24px; border-radius: 50%; background: var(--gold); color: #fff; font-size: .85rem; font-weight: 900; display: grid; place-items: center; box-shadow: 0 2px 0 var(--gold-d); }
    .node.current { outline: 6px solid var(--locked); outline-offset: 5px; }
    .node.chest { --c: var(--gold); --cd: var(--gold-d); border-radius: 18px; }
    .node.chest.opened { opacity: .55; }
    .start-bubble {
      position: absolute; left: 50%; bottom: calc(100% + 18px); transform: translateX(-50%);
      background: var(--bg); color: var(--c); border: 2px solid var(--border);
      font-weight: 800; letter-spacing: .06em; padding: 8px 12px; border-radius: 12px; white-space: nowrap;
      animation: bob 1.2s ease-in-out infinite; pointer-events: none; font-size: .9rem;
    }
    .start-bubble::after { content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); border: 8px solid transparent; border-top-color: var(--border); }
    @keyframes bob { 50% { transform: translate(-50%, -6px); } }
    .path-mascot { position: absolute; width: 96px; top: 70px; pointer-events: none; }

    /* Bottom sheet / modal */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
    .overlay.center { align-items: center; padding: 16px; }
    .sheet { background: var(--bg); width: 100%; max-width: 520px; border-radius: 22px 22px 0 0; padding: 22px 18px calc(22px + env(safe-area-inset-bottom)); animation: up .2s ease-out; }
    .overlay.center .sheet { border-radius: 22px; padding-bottom: 22px; }
    .sheet h2 { font-size: 1.35rem; font-weight: 800; margin-bottom: 6px; text-align: center; }
    .sheet p { color: var(--muted); text-align: center; margin-bottom: 18px; line-height: 1.4; }
    .sheet .big-ico { font-size: 3.5rem; text-align: center; margin-bottom: 8px; }
    .sheet textarea { width: 100%; min-height: 90px; border: 2px solid var(--border); border-radius: 12px; background: var(--surface-2); color: var(--text); padding: 10px; font: inherit; font-size: .8rem; margin-bottom: 14px; user-select: text; -webkit-user-select: text; }
    @keyframes up { from { transform: translateY(40px); opacity: 0; } }
    @keyframes fade { from { opacity: 0; } }

    /* Lesson */
    .lesson-top { display: flex; align-items: center; gap: 14px; padding: calc(14px + env(safe-area-inset-top)) 16px 8px; max-width: 620px; width: 100%; margin: 0 auto; }
    .x-btn { font-size: 1.6rem; color: var(--muted); padding: 2px 6px; line-height: 1; }
    .lesson-top .bar { height: 16px; }
    .lesson-top .bar > i { background: var(--green); }
    .lesson-body { flex: 1; overflow-y: auto; padding: 12px 16px 24px; max-width: 620px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; }
    .ex-label { font-size: .8rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--purple); margin-bottom: 6px; }
    .ex-title { font-size: 1.45rem; font-weight: 800; margin-bottom: 18px; line-height: 1.25; }
    .combo { color: var(--orange); font-weight: 800; font-size: .85rem; margin-bottom: 4px; }

    .choices4 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .choice {
      border: 2px solid var(--border); border-radius: 16px; box-shadow: 0 4px 0 var(--border);
      padding: 14px 10px; text-align: center; font-weight: 700; font-size: 1.05rem; background: var(--bg);
      transition: transform .05s;
    }
    .choice:active { transform: translateY(2px); }
    .choice .emo { font-size: 3.4rem; display: block; margin-bottom: 8px; line-height: 1.1; }
    .choice.sel { background: var(--sel-bg); border-color: var(--sel-border); box-shadow: 0 4px 0 var(--sel-border); color: var(--blue); }
    .choice.good { background: var(--ok-bg); border-color: var(--green); box-shadow: 0 4px 0 var(--green); color: var(--ok-text); }
    .choice.wrong { background: var(--bad-bg); border-color: var(--red); box-shadow: 0 4px 0 var(--red); color: var(--bad-text); animation: shake .3s; }
    .choice.gone { opacity: .35; pointer-events: none; box-shadow: 0 4px 0 var(--border); }
    .choice-list { display: flex; flex-direction: column; gap: 12px; }
    .choice-list .choice { text-align: left; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
    .choice .kbd { display: inline-grid; place-items: center; min-width: 28px; height: 28px; border: 2px solid var(--border); border-radius: 8px; font-size: .85rem; color: var(--muted); }
    @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

    .prompt-row { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 18px; }
    .prompt-row svg { width: 92px; flex-shrink: 0; }
    .bubble { position: relative; border: 2px solid var(--border); border-radius: 16px; padding: 12px 14px; font-size: 1.1rem; line-height: 1.5; margin-bottom: 30px; }
    .bubble::before { content: ""; position: absolute; left: -12px; bottom: 14px; border: 6px solid transparent; border-right: 6px solid var(--border); border-bottom: 6px solid var(--border); }
    .say { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--blue); box-shadow: 0 3px 0 var(--blue-d); color: #fff; font-size: 1rem; margin-right: 6px; vertical-align: middle; }
    .w { border-bottom: 2px dashed var(--muted); cursor: pointer; position: relative; }
    .tip { position: absolute; left: 50%; top: calc(100% + 8px); transform: translateX(-50%); background: var(--bg); border: 2px solid var(--border); border-radius: 10px; padding: 6px 10px; font-size: .9rem; font-weight: 700; white-space: nowrap; z-index: 3; box-shadow: 0 4px 12px rgba(0,0,0,.12); }

    .answer-line { min-height: 118px; border-top: 2px solid var(--border); border-bottom: 2px solid var(--border); padding: 10px 0; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; margin-bottom: 26px; background-image: linear-gradient(var(--border), var(--border)); background-size: 100% 2px; background-position: 0 58px; background-repeat: no-repeat; }
    .bank { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .tok { border: 2px solid var(--border); border-radius: 12px; box-shadow: 0 3px 0 var(--border); padding: 8px 12px; font-size: 1.05rem; font-weight: 600; background: var(--bg); transition: transform .05s; }
    .tok:active { transform: translateY(2px); }
    .tok.used { background: var(--locked); color: transparent; box-shadow: none; border-color: var(--locked); pointer-events: none; }

    .listen-btns { display: flex; justify-content: center; gap: 16px; margin: 8px 0 26px; }
    .listen-big { width: 120px; height: 100px; border-radius: 20px; background: var(--blue); box-shadow: 0 5px 0 var(--blue-d); color: #fff; font-size: 3rem; }
    .listen-slow { width: 72px; height: 72px; border-radius: 18px; background: var(--blue); box-shadow: 0 5px 0 var(--blue-d); color: #fff; font-size: 1.9rem; align-self: flex-end; }
    .listen-big:active, .listen-slow:active { transform: translateY(5px); box-shadow: none; }

    .type-box { width: 100%; min-height: 140px; border: 2px solid var(--border); border-radius: 16px; background: var(--surface-2); color: var(--text); font: inherit; font-size: 1.1rem; padding: 12px; resize: none; }
    .type-box:focus { outline: none; border-color: var(--sel-border); }
    .accents { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .accents button { border: 2px solid var(--border); border-radius: 8px; padding: 4px 10px; font-weight: 700; box-shadow: 0 2px 0 var(--border); }

    .match { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .match .col { display: flex; flex-direction: column; gap: 12px; }
    .match .choice { padding: 16px 8px; font-size: 1rem; }

    .lesson-foot { border-top: 2px solid var(--border); padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); transition: background .15s; }
    .lesson-foot .inner { max-width: 620px; margin: 0 auto; }
    .lesson-foot.ok { background: var(--ok-bg); border-color: transparent; }
    .lesson-foot.bad { background: var(--bad-bg); border-color: transparent; }
    .fb { display: none; margin-bottom: 14px; }
    .lesson-foot.ok .fb, .lesson-foot.bad .fb { display: flex; gap: 12px; align-items: flex-start; }
    .fb .fb-ico { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-size: 1.4rem; font-weight: 900; }
    .ok .fb-ico { color: var(--green); }
    .bad .fb-ico { color: var(--red); }
    .fb h4 { font-size: 1.25rem; font-weight: 800; }
    .ok .fb h4, .ok .fb p { color: var(--ok-text); }
    .bad .fb h4, .bad .fb p { color: var(--bad-text); }
    .fb p { font-size: 1rem; margin-top: 2px; }
    .lesson-foot.bad .btn { --c: var(--red); --cd: var(--red-d); }
    .skip-row { display: flex; gap: 12px; }
    .skip-row .btn.ghost { flex: 0 0 auto; width: auto; color: var(--muted); }
    .skip-row .btn:not(.ghost) { flex: 1; }
    .skip-row .btn + .btn { margin-top: 0; }

    /* Result screens */
    .center-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; text-align: center; max-width: 520px; margin: 0 auto; width: 100%; }
    .center-col svg.mascot { width: 150px; margin-bottom: 18px; animation: pop .5s ease-out; }
    .center-col h1 { font-size: 1.8rem; font-weight: 900; color: var(--gold); margin-bottom: 22px; }
    .center-col h1.green { color: var(--green); }
    .center-col h1.orange { color: var(--orange); }
    .tiles { display: flex; gap: 10px; width: 100%; }
    .tile { flex: 1; border: 2px solid var(--c); border-radius: 16px; overflow: hidden; background: var(--c); }
    .tile small { display: block; color: #fff; font-weight: 800; font-size: .7rem; letter-spacing: .06em; padding: 4px 0; text-transform: uppercase; }
    .tile b { display: block; background: var(--bg); border-radius: 13px; padding: 12px 4px; font-size: 1.25rem; color: var(--c); }
    .foot-pad { padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); max-width: 520px; width: 100%; margin: 0 auto; }
    .streak-num { font-size: 5.5rem; font-weight: 900; color: var(--orange); line-height: 1; }
    .week { display: flex; gap: 8px; justify-content: center; margin: 22px 0 10px; }
    .week div { text-align: center; font-weight: 800; color: var(--muted); font-size: .8rem; }
    .week i { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--locked); margin-top: 6px; font-style: normal; color: #fff; }
    .week i.on { background: var(--orange); }
    @keyframes pop { 0% { transform: scale(.5); opacity: 0; } 70% { transform: scale(1.08); } }

    /* Lists, profile, shop */
    h2.sec { font-size: 1.4rem; font-weight: 800; margin: 4px 0 14px; }
    .row { display: flex; align-items: center; gap: 14px; }
    .row .grow { flex: 1; min-width: 0; }
    .shop-item { border: 2px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
    .shop-item .ico { font-size: 2.4rem; }
    .shop-item h4 { font-weight: 800; font-size: 1.05rem; }
    .shop-item p { color: var(--muted); font-size: .88rem; margin-top: 2px; }
    .price { border: 2px solid var(--border); border-radius: 12px; padding: 8px 12px; font-weight: 800; color: var(--blue); box-shadow: 0 3px 0 var(--border); white-space: nowrap; }
    .price:disabled { color: var(--muted); opacity: .6; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .stats-grid > div { border: 2px solid var(--border); border-radius: 14px; padding: 12px; display: flex; gap: 10px; align-items: center; }
    .stats-grid b { display: block; font-size: 1.15rem; font-weight: 800; }
    .stats-grid small { color: var(--muted); font-size: .8rem; }
    .stats-grid .ico { font-size: 1.5rem; }
    .chart { display: flex; align-items: flex-end; gap: 8px; height: 130px; padding-top: 10px; }
    .chart > div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
    .chart i { display: block; width: 100%; max-width: 30px; background: var(--gold); border-radius: 6px 6px 2px 2px; min-height: 3px; }
    .chart i.zero { background: var(--locked); }
    .chart small { font-size: .7rem; font-weight: 800; color: var(--muted); margin-top: 6px; }
    .chart em { font-style: normal; font-size: .7rem; font-weight: 800; color: var(--muted); margin-bottom: 3px; }
    .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .seg button { border: 2px solid var(--border); border-radius: 12px; padding: 10px 4px; font-weight: 800; box-shadow: 0 3px 0 var(--border); }
    .seg button.on { background: var(--sel-bg); border-color: var(--sel-border); color: var(--blue); box-shadow: 0 3px 0 var(--sel-border); }
    .setting { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 2px solid var(--border); font-weight: 700; }
    .setting:last-child { border-bottom: 0; }
    .toggle { width: 52px; height: 30px; border-radius: 99px; background: var(--locked); position: relative; transition: background .15s; }
    .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; }
    .toggle.on { background: var(--green); }
    .toggle.on::after { left: 25px; }
    .word-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 2px solid var(--border); }
    .word-row:last-child { border-bottom: 0; }
    .word-row .emo { font-size: 1.6rem; width: 36px; text-align: center; }
    .word-row b { display: block; font-weight: 800; }
    .word-row small { color: var(--muted); }
    .empty { color: var(--muted); text-align: center; padding: 20px 0; }

    /* Welcome */
    .welcome h1 { color: var(--green); font-size: 2.6rem; font-weight: 900; margin-bottom: 8px; }
    .welcome p.lead { color: var(--muted); font-size: 1.1rem; margin-bottom: 28px; }
    .goal-list { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .goal-list .choice { display: flex; justify-content: space-between; text-align: left; padding: 16px; }
    .goal-list .choice span { color: var(--muted); font-weight: 600; }

    .toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 100; animation: fade .2s; max-width: 90vw; text-align: center; }
  </style>
</head>
<body>

<!-- Welcome / onboarding -->
<div class="screen hidden" id="welcome"></div>

<!-- Main app -->
<div class="screen hidden" id="home">
  <div class="topbar">
    <span class="flag" title="Spanish">🇪🇸</span>
    <button class="stat streak" id="st-streak"><span class="ico">🔥</span><span></span></button>
    <button class="stat gems" id="st-gems"><span class="ico">💎</span><span></span></button>
    <button class="stat hearts" id="st-hearts"><span class="ico">❤️</span><span></span></button>
  </div>
  <div class="tab-body" id="tab-body"></div>
  <nav class="nav" id="nav">
    <button data-tab="learn" class="on">🏠<span>Learn</span></button>
    <button data-tab="practice">🏋️<span>Practice</span></button>
    <button data-tab="shop">🛍️<span>Shop</span></button>
    <button data-tab="profile">🦊<span>Profile</span></button>
  </nav>
</div>

<!-- Lesson -->
<div class="screen hidden" id="lesson">
  <div class="lesson-top">
    <button class="x-btn" id="quit" aria-label="Quit lesson">✕</button>
    <div class="bar"><i id="lesson-prog" style="width:0%"></i></div>
    <div class="stat hearts" id="lesson-hearts"><span class="ico">❤️</span><span></span></div>
  </div>
  <div class="lesson-body" id="ex"></div>
  <div class="lesson-foot" id="foot">
    <div class="inner">
      <div class="fb">
        <div class="fb-ico" id="fb-ico"></div>
        <div><h4 id="fb-title"></h4><p id="fb-text"></p></div>
      </div>
      <div class="skip-row">
        <button class="btn ghost" id="skip">Skip</button>
        <button class="btn" id="check" disabled>Check</button>
      </div>
    </div>
  </div>
</div>

<!-- Result / streak screens -->
<div class="screen hidden" id="result"></div>

<script src="app.js"></script>
</body>
</html>
