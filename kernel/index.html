<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kernel">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121014" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Swipe through one-minute ideas from the best books on habits, psychology, money, health and more. Save the ones you love.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Kernel Ideas</title>
  <style>
    :root {
      --bg: #f6f3ee; --surface: #ffffff; --surface-2: #efe9e0; --border: #e3dbcf;
      --text: #1d1a17; --muted: #6b645c; --faint: #a39b91;
      --accent: #d9480f; --accent-soft: rgba(217, 72, 15, .1); --on-accent: #ffffff;
      --like: #e03158; --save: #d9480f;
      --card-l1: 94%; --card-l2: 88%; --card-s: 60%; --card-text: #1d1a17; --card-muted: rgba(29, 26, 23, .62);
      --shadow: 0 4px 18px rgba(40, 30, 20, .08);
      --nav-h: 62px;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121014; --surface: #1c191f; --surface-2: #26222a; --border: #332e38;
        --text: #f3eff5; --muted: #aaa2b0; --faint: #6d6574;
        --accent: #ff7a3d; --accent-soft: rgba(255, 122, 61, .14); --on-accent: #1a0b03;
        --like: #ff5c7f; --save: #ff7a3d;
        --card-l1: 20%; --card-l2: 11%; --card-s: 38%; --card-text: #f8f4ef; --card-muted: rgba(248, 244, 239, .66);
        --shadow: 0 4px 18px rgba(0, 0, 0, .4);
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      color: var(--text); line-height: 1.45; overflow: hidden;
      -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overscroll-behavior: none;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    input, select, textarea { font: inherit; color: inherit; }
    svg { display: block; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .small { font-size: .85rem; }
    h1 { font-size: 1.9rem; letter-spacing: -.02em; line-height: 1.1; font-weight: 800; }
    h2 { font-size: 1.15rem; letter-spacing: -.01em; }

    /* ---------- Layout ---------- */
    .view { position: fixed; inset: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg); }
    #layer { z-index: 20; }
    .wrap { max-width: 680px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 16px 36px; }
    .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 0 18px; }
    .backbar { display: flex; align-items: center; gap: 8px; margin: 4px 0 12px; }
    .iconbtn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; }
    .iconbtn svg { width: 22px; height: 22px; }
    .iconbtn:hover { background: var(--surface-2); }
    .section { margin: 26px 0 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .section h2 { font-size: 1.05rem; }
    .linkbtn { color: var(--accent); font-weight: 650; font-size: .9rem; }

    /* ---------- Bottom nav ---------- */
    nav.tabs {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
      background: var(--surface); border-top: 1px solid var(--border);
      display: grid; grid-template-columns: repeat(5, 1fr);
    }
    nav.tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .68rem; font-weight: 650; color: var(--faint); }
    nav.tabs button svg { width: 24px; height: 24px; }
    nav.tabs button.on { color: var(--text); }
    nav.tabs .create span.plus { width: 46px; height: 32px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
    nav.tabs .create svg { width: 20px; height: 20px; }

    /* ---------- Feed ---------- */
    .feed { position: absolute; inset: 0; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain; }
    .feed::-webkit-scrollbar { display: none; }
    .card {
      --h: 38;
      position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always;
      background: radial-gradient(120% 80% at 10% 0%, hsl(var(--h) var(--card-s) var(--card-l1)), hsl(var(--h) calc(var(--card-s) - 10%) var(--card-l2)));
      color: var(--card-text); display: flex; align-items: center; justify-content: center;
      padding: calc(64px + env(safe-area-inset-top)) 72px 24px 22px; overflow: hidden;
    }
    .card-in { width: 100%; max-width: 560px; max-height: 100%; overflow-y: auto; scrollbar-width: none; padding: 6px 2px; }
    .card-in::-webkit-scrollbar { display: none; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 99px; font-size: .78rem; font-weight: 700; background: rgba(127, 127, 127, .16); color: inherit; }
    .card h2.title { font-family: var(--serif); font-size: clamp(1.6rem, 6.4vw, 2.2rem); line-height: 1.12; letter-spacing: -.015em; font-weight: 700; margin: 16px 0 14px; }
    .card p.body { font-size: clamp(1.02rem, 4.2vw, 1.14rem); line-height: 1.6; }
    .card .meta { margin-top: 18px; font-size: .78rem; color: var(--card-muted); font-weight: 600; display: flex; gap: 10px; align-items: center; }
    .srcbtn { display: flex; align-items: center; gap: 12px; margin-top: 22px; padding: 10px 14px 10px 10px; border-radius: 14px; background: rgba(127, 127, 127, .13); width: 100%; max-width: 420px; }
    .srcbtn:hover { background: rgba(127, 127, 127, .2); }
    .srcbtn .t { font-weight: 700; font-size: .92rem; line-height: 1.25; }
    .srcbtn .a { font-size: .8rem; color: var(--card-muted); }
    .srcbtn svg.chev { width: 18px; height: 18px; margin-left: auto; opacity: .6; flex: none; }
    .rail { position: absolute; right: 12px; bottom: 28px; display: flex; flex-direction: column; gap: 14px; align-items: center; z-index: 2; }
    .rail button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .68rem; font-weight: 700; color: var(--card-muted); }
    .rail button .ring { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: rgba(127, 127, 127, .16); color: var(--card-text); transition: transform .15s; }
    .rail button:active .ring { transform: scale(.88); }
    .rail svg { width: 23px; height: 23px; }
    .rail button.liked .ring { color: var(--like); }
    .rail button.saved .ring { color: var(--save); }
    .burst { position: absolute; left: 50%; top: 50%; width: 110px; height: 110px; margin: -55px 0 0 -55px; color: var(--like); pointer-events: none; animation: burst .75s ease-out forwards; z-index: 3; }
    @keyframes burst { 0% { transform: scale(.3); opacity: 0; } 25% { transform: scale(1.1); opacity: .95; } 100% { transform: scale(1.35) translateY(-30px); opacity: 0; } }
    .readmark { position: absolute; top: calc(64px + env(safe-area-inset-top)); right: 18px; font-size: .7rem; font-weight: 700; color: var(--card-muted); display: flex; gap: 4px; align-items: center; }
    .readmark svg { width: 14px; height: 14px; }

    .feedtop { position: absolute; top: 0; left: 0; right: 0; z-index: 5; padding: calc(10px + env(safe-area-inset-top)) 14px 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; pointer-events: none; }
    .feedtop > * { pointer-events: auto; }
    .seg { display: inline-flex; background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 99px; padding: 3px; box-shadow: var(--shadow); }
    .seg button { padding: 7px 14px; border-radius: 99px; font-size: .86rem; font-weight: 700; color: var(--muted); }
    .seg button.on { background: var(--text); color: var(--bg); }
    .goalpill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px 6px 6px; border-radius: 99px; font-size: .82rem; font-weight: 750; background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: var(--shadow); }
    .goalpill svg { width: 26px; height: 26px; }
    .feedtitle { display: flex; align-items: center; gap: 6px; padding: 4px 14px 4px 4px; border-radius: 99px; background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: var(--shadow); font-weight: 750; font-size: .9rem; max-width: 70vw; }
    .feedtitle span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .feedtitle .iconbtn { width: 34px; height: 34px; }
    .endcard { flex-direction: column; text-align: center; gap: 12px; padding-right: 22px; }
    .endcard .big { font-size: 3rem; }
    .endcard h2 { font-family: var(--serif); font-size: 1.7rem; }
    .endcard p { color: var(--card-muted); max-width: 360px; }
    .endcard .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }

    /* ---------- Buttons, inputs ---------- */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 14px; font-weight: 700; background: var(--accent); color: var(--on-accent); }
    .btn svg { width: 18px; height: 18px; }
    .btn.ghost { background: var(--surface-2); color: var(--text); }
    .btn.danger { background: transparent; color: var(--like); border: 1px solid var(--border); }
    .btn.block { width: 100%; }
    .btn:disabled { opacity: .45; cursor: default; }
    .field { display: block; margin-bottom: 14px; }
    .field > span { display: block; font-size: .82rem; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
    .field input, .field textarea, .field select { width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 12px 14px; }
    .field textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
    .field .count { float: right; font-weight: 600; color: var(--faint); }
    .search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 0 12px; }
    .search svg { width: 20px; height: 20px; color: var(--faint); flex: none; }
    .search input { flex: 1; border: 0; background: none; padding: 12px 0; outline: none; min-width: 0; }

    /* ---------- Topics, lists, covers ---------- */
    .topicgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .topic { --h: 38; position: relative; border-radius: 16px; padding: 14px; min-height: 86px; display: flex; flex-direction: column; justify-content: space-between; background: hsl(var(--h) var(--card-s) var(--card-l1)); color: var(--card-text); border: 2px solid transparent; }
    .topic .e { font-size: 1.5rem; }
    .topic b { font-size: .98rem; }
    .topic small { color: var(--card-muted); font-weight: 600; font-size: .76rem; }
    .topic.on { border-color: var(--accent); }
    .topic .tick { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
    .topic .tick svg { width: 14px; height: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { padding: 7px 13px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); font-size: .86rem; font-weight: 650; }
    .chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }

    .cover { --h: 38; width: 44px; height: 60px; border-radius: 4px 7px 7px 4px; flex: none; position: relative; overflow: hidden; background: linear-gradient(135deg, hsl(var(--h) 55% 45%), hsl(calc(var(--h) + 30) 55% 30%)); color: #fff; font-family: var(--serif); font-weight: 700; font-size: .62rem; line-height: 1.1; padding: 5px 4px 5px 8px; box-shadow: 0 2px 6px rgba(0, 0, 0, .18); }
    .cover::before { content: ""; position: absolute; left: 3px; top: 0; bottom: 0; width: 2px; background: rgba(255, 255, 255, .25); }
    .cover.lg { width: 104px; height: 148px; font-size: 1rem; padding: 12px 10px 12px 16px; border-radius: 5px 10px 10px 5px; }
    .cover.lg::before { left: 6px; width: 3px; }
    .cover.sm { width: 32px; height: 44px; font-size: 0; }
    .shelf { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 10px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
    .shelf::-webkit-scrollbar { display: none; }
    .book { width: 104px; flex: none; }
    .book .t { font-size: .82rem; font-weight: 700; line-height: 1.25; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .book .a { font-size: .74rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .list { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; border-top: 1px solid var(--border); }
    .row:first-child { border-top: 0; }
    .row:hover { background: var(--surface-2); }
    .row .grow { flex: 1; min-width: 0; }
    .row .t { font-weight: 700; line-height: 1.3; }
    .row .s { font-size: .82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row svg.chev { width: 18px; height: 18px; color: var(--faint); flex: none; }
    .row .bar { --h: 38; width: 6px; align-self: stretch; border-radius: 3px; background: hsl(var(--h) 60% 55%); flex: none; }
    .row .ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); font-size: 1.2rem; flex: none; }
    .row .ico svg { width: 22px; height: 22px; }
    .row .n { font-size: .82rem; font-weight: 700; color: var(--muted); }
    .empty { text-align: center; padding: 34px 16px; color: var(--muted); }
    .empty .big { font-size: 2.4rem; margin-bottom: 8px; }

    .srchead { display: flex; gap: 18px; align-items: flex-end; margin: 6px 0 18px; }
    .srchead h1 { font-family: var(--serif); font-size: 1.6rem; }

    /* ---------- Stats ---------- */
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; }
    .stat b { display: block; font-size: 1.6rem; letter-spacing: -.02em; }
    .stat span { font-size: .8rem; color: var(--muted); font-weight: 650; }
    .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 10px; text-align: center; }
    .week .d { font-size: .72rem; font-weight: 700; color: var(--muted); }
    .week .dot { width: 30px; height: 30px; border-radius: 50%; margin: 6px auto 0; display: grid; place-items: center; background: var(--surface-2); font-size: .75rem; font-weight: 750; color: var(--muted); }
    .week .dot.part { background: var(--accent-soft); color: var(--accent); }
    .week .dot.full { background: var(--accent); color: var(--on-accent); }
    .week .dot.today { box-shadow: 0 0 0 2px var(--text); }

    /* ---------- Sheet, toast, onboarding ---------- */
    #scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 60; opacity: 0; pointer-events: none; transition: opacity .2s; }
    #scrim.show { opacity: 1; pointer-events: auto; }
    #sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; max-width: 560px; margin: 0 auto; background: var(--bg); border-radius: 22px 22px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom)); max-height: 82vh; overflow-y: auto; transform: translateY(105%); transition: transform .25s cubic-bezier(.2, .8, .2, 1); }
    #sheet.show { transform: none; }
    #sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 0 auto 12px; }
    #sheet h2 { margin-bottom: 12px; }
    .check { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--border); display: grid; place-items: center; flex: none; }
    .check.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .check svg { width: 15px; height: 15px; }
    .newstash { display: flex; gap: 8px; margin-top: 12px; }
    .newstash input { flex: 1; min-width: 0; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 10px 12px; }
    #toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 650; font-size: .9rem; opacity: 0; pointer-events: none; transition: .2s; z-index: 90; max-width: calc(100% - 32px); text-align: center; }
    #toast.show { opacity: 1; transform: translateX(-50%); }

    #onboard { position: fixed; inset: 0; z-index: 80; background: var(--bg); overflow-y: auto; }
    #onboard .wrap { padding-top: calc(32px + env(safe-area-inset-top)); padding-bottom: 120px; }
    #onboard .logo { width: 64px; height: 64px; border-radius: 18px; margin-bottom: 18px; }
    #onboard h1 { font-family: var(--serif); font-size: 2.1rem; }
    #onboard .foot { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); }
    #onboard .foot .btn { max-width: 648px; margin: 0 auto; display: flex; }
    .goals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .goals button { border: 2px solid var(--border); background: var(--surface); border-radius: 14px; padding: 12px; text-align: center; }
    .goals button b { display: block; font-size: 1.4rem; }
    .goals button span { font-size: .78rem; color: var(--muted); font-weight: 600; }
    .goals button.on { border-color: var(--accent); background: var(--accent-soft); }

    @media (min-width: 760px) {
      .card { padding-right: 110px; }
      .rail { right: calc(50% - 360px); bottom: 50%; transform: translateY(50%); }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } .feed { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <main id="main" class="view" aria-live="off"></main>
  <section id="layer" class="view hidden" aria-label="Detail"></section>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="home" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button data-tab="explore" aria-label="Explore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Explore</button>
    <button data-tab="create" class="create" aria-label="Write an idea"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
    <button data-tab="library" aria-label="Library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Library</button>
    <button data-tab="you" aria-label="You"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>You</button>
  </nav>

  <div id="scrim"></div>
  <div id="sheet" role="dialog" aria-modal="true" aria-label="Options"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="onboard" class="hidden"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
