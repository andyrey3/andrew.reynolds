<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sillage">
  <meta name="theme-color" content="#F5F4F8">
  <meta name="description" content="Sort your fragrances onto the fragrance wheel, see the families you're missing, and find the best bottle and best dupe in each">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Sillage Scent Wheel</title>
  <style>
    :root {
      --paper: #F5F4F8; --surface: #FFFFFF; --sunk: #ECEAF1; --line: #E0DCE6;
      --ink: #231F2B; --muted: #6E6878; --faint: #A39DAD;
      --hatch: rgba(35, 31, 43, .16); --hub: #FFFFFF;
      --focus: #3E6F9E;
      --sans: "Avenir Next", Avenir, "Nunito Sans", "Century Gothic", "Segoe UI", system-ui, sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #17151C; --surface: #211E28; --sunk: #2A2632; --line: #36313F;
        --ink: #EFECF4; --muted: #A9A2B4; --faint: #6F6879;
        --hatch: rgba(239, 236, 244, .14); --hub: #211E28;
        --focus: #8FB6DD;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--sans); background: var(--paper); color: var(--ink);
      font-size: 16px; line-height: 1.45; min-height: 100vh;
      padding: max(20px, env(safe-area-inset-top)) 16px max(40px, env(safe-area-inset-bottom));
    }
    button, input, select { font: inherit; color: inherit; }
    :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

    .app { max-width: 1080px; margin: 0 auto; }
    .masthead { padding: 8px 0 4px; }
    .masthead h1 { font-size: clamp(2.4rem, 9vw, 3.6rem); font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
    .masthead p { color: var(--muted); margin-top: 8px; max-width: 34em; }

    .layout { display: grid; gap: 28px; margin-top: 18px; }
    @media (min-width: 900px) {
      .layout { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 56px; align-items: start; margin-top: 28px; }
      .wheel-col { position: sticky; top: 24px; }
    }

    /* ---- wheel ---- */
    .wheel-wrap { width: 100%; max-width: 520px; margin: 0 auto; }
    #wheel { display: block; width: 100%; height: auto; overflow: visible; touch-action: manipulation; }
    .seg { cursor: pointer; transition: transform .28s cubic-bezier(.2, .8, .2, 1); -webkit-tap-highlight-color: transparent; }
    .seg.sel { transform: translate(var(--dx), var(--dy)); }
    .seg:focus { outline: none; }
    .seg:focus-visible .seg-fill, .seg:focus-visible .seg-empty { stroke: var(--focus); stroke-width: 3; }
    .seg-fill { stroke: var(--paper); stroke-width: 1; }
    .seg-empty { fill: var(--surface); }
    .hatch-line { stroke: currentColor; stroke-width: 1.4; opacity: .45; }
    .seg-hatch { opacity: .55; }
    @media (hover: hover) { .seg.miss:hover .seg-hatch { opacity: 1; } .seg.have:hover .seg-fill { filter: brightness(1.05); } }
    .seg-label { font: 600 10.5px var(--sans); letter-spacing: .02em; pointer-events: none; }
    .group-label { font: 600 13px var(--sans); letter-spacing: .01em; pointer-events: none; }
    .group { pointer-events: none; }
    .dot { pointer-events: none; }
    .hub { fill: var(--hub); }
    .hub-num { font: 600 46px var(--sans); fill: var(--ink); letter-spacing: -0.04em; }
    .hub-sub { font: 500 11.5px var(--sans); fill: var(--muted); }
    .seg.pop .seg-fill { animation: fill-in .6s cubic-bezier(.2, .8, .2, 1); transform-origin: 0 0; }
    @keyframes fill-in { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }

    .legend { display: flex; gap: 18px; justify-content: center; margin-top: 14px; color: var(--muted); font-size: .85rem; }
    .legend span { display: inline-flex; align-items: center; gap: 7px; }
    .legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
    .legend .l-have { background: linear-gradient(135deg, #F79FC9, #5B9DBA); }
    .legend .l-miss { border: 1.5px dashed var(--faint); background: repeating-linear-gradient(45deg, transparent 0 3px, var(--hatch) 3px 4.5px); }

    /* ---- sections ---- */
    section + section { margin-top: 36px; }
    .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    h2.sec { font-size: 1.45rem; font-weight: 600; letter-spacing: -0.02em; }
    .count { color: var(--muted); font-size: .9rem; }
    .hint { color: var(--muted); max-width: 36em; }
    .swatch { width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block; }

    .gaps { list-style: none; border-top: 1px solid var(--line); }
    .gap {
      display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
      background: none; border: 0; border-bottom: 1px solid var(--line); padding: 13px 4px; cursor: pointer;
    }
    .gap .swatch { width: 26px; height: 26px; border-radius: 8px; }
    .gap-text { display: flex; flex-direction: column; min-width: 0; }
    .gap-text strong { font-weight: 600; }
    .gap-text span { color: var(--muted); font-size: .9rem; }
    @media (hover: hover) { .gap:hover strong { text-decoration: underline; text-underline-offset: 3px; } }

    /* ---- add ---- */
    .add-box { position: relative; }
    input[type="search"] {
      width: 100%; padding: 13px 16px; border-radius: 14px; border: 1.5px solid var(--line);
      background: var(--surface); font-size: 1rem; -webkit-appearance: none; appearance: none;
    }
    input[type="search"]:focus { border-color: var(--focus); outline: none; }
    #add-results { margin-top: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    #add-results ul { list-style: none; }
    .result {
      display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%;
      text-align: left; padding: 11px 14px; background: none; border: 0; border-top: 1px solid var(--line); cursor: pointer;
    }
    #add-results li:first-child .result { border-top: 0; }
    .result:disabled { cursor: default; opacity: .6; }
    @media (hover: hover) { .result:not(:disabled):hover { background: var(--sunk); } }
    .result-name { display: flex; flex-direction: column; min-width: 0; }
    .result-name strong { font-weight: 600; }
    .result-name span { color: var(--muted); font-size: .88rem; }
    .result-fam { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: .88rem; white-space: nowrap; }
    .custom-row { color: var(--focus); font-weight: 600; }
    .custom { padding: 14px; }
    .custom p { margin-bottom: 12px; }
    .fam-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .fam-chip {
      display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px 7px 10px; border-radius: 999px;
      border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-size: .92rem;
    }
    @media (hover: hover) { .fam-chip:hover { border-color: var(--fam); } }
    .text-btn { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 4px 0; }

    .bottles { list-style: none; margin-top: 16px; border-top: 1px solid var(--line); }
    .bottle {
      display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 12px;
      padding: 10px 0 10px 14px; border-bottom: 1px solid var(--line); position: relative;
    }
    .bottle::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 2px; background: var(--fam); }
    .bottle-name { display: flex; flex-direction: column; min-width: 0; }
    .bottle-name strong { font-weight: 600; overflow-wrap: anywhere; }
    .bottle-name span { color: var(--muted); font-size: .88rem; }
    .fam-pick { display: inline-flex; align-items: center; gap: 6px; position: relative; }
    .fam-pick select {
      -webkit-appearance: none; appearance: none; background: var(--sunk); border: 0; border-radius: 999px;
      padding: 6px 12px; font-size: .85rem; color: var(--ink); cursor: pointer; max-width: 9.5rem;
    }
    .fam-pick .swatch { display: none; }
    .remove {
      width: 36px; height: 36px; border-radius: 50%; border: 0; background: none; color: var(--faint);
      font-size: 1.4rem; line-height: 1; cursor: pointer;
    }
    @media (hover: hover) { .remove:hover { color: var(--ink); background: var(--sunk); } }

    /* ---- family view: shown in the page itself, not as an overlay, so it
       works inside any frame or webview whatever its height ---- */
    #sheet { background: var(--surface); border-radius: 22px; overflow: hidden; animation: view-in .3s cubic-bezier(.2, .8, .2, 1); }
    @keyframes view-in { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
    .app.detail #lists { display: none; }
    @media (max-width: 899px) { .app.detail .wheel-col, .app.detail .masthead, .app.detail .back { display: none; } .app.detail .layout { margin-top: 0; } }
    .sheet-head { background: var(--fam); color: var(--fam-ink); padding: 16px 22px 22px; }
    .sheet-group { font-size: .9rem; opacity: .8; margin-top: 14px; }
    .sheet-head h2 { font-size: 2.4rem; font-weight: 600; letter-spacing: -0.035em; line-height: 1.05; margin-top: 2px; text-wrap: balance; }
    .sheet-status { margin-top: 10px; font-size: .95rem; }
    #sheet-close {
      display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; cursor: pointer;
      background: rgba(255, 255, 255, .6); color: #231F2B; font-size: .92rem; font-weight: 600; padding: 7px 14px 7px 10px;
    }
    .sheet-content { padding: 20px 22px 32px; }
    .smells { font-size: 1.08rem; }
    .wear { color: var(--muted); margin-top: 6px; }
    .sheet-content h3 { font-size: 1.1rem; font-weight: 600; margin: 26px 0 10px; letter-spacing: -0.01em; }
    .picks { list-style: none; border-top: 1px solid var(--line); }
    .pick { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .pick-head { display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center; }
    .pick-head strong { display: block; font-weight: 600; font-size: 1.05rem; }
    .brand { color: var(--muted); font-size: .9rem; }
    .notes { color: var(--muted); font-size: .9rem; margin-top: 6px; }
    .price { color: var(--muted); font-size: .85rem; letter-spacing: .06em; white-space: nowrap; }
    .dupe {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 10px;
      padding: 9px 10px 9px 12px; border-radius: 12px; background: var(--sunk); font-size: .93rem;
    }
    .dupe-name { font-weight: 600; flex: 1; min-width: 8em; }
    .dupe .add-btn { margin-left: auto; }
    .dupe-tag { color: var(--muted); font-size: .85rem; flex-basis: 100%; }
    .dupe.quiet { color: var(--muted); }
    .add-btn {
      border: 1.5px solid var(--ink); background: none; border-radius: 999px; padding: 5px 14px;
      font-size: .85rem; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .add-btn.done { border-color: transparent; color: var(--muted); cursor: default; font-weight: 500; }
    @media (hover: hover) { .add-btn:not(.done):hover { background: var(--ink); color: var(--surface); } }
    .catalog { list-style: none; margin-top: 10px; }
    .catalog li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .catalog li.hint { display: block; border: 0; }
    .try { margin-top: 14px; }

    /* Bottle photos sit on white tiles, like a product shot, in both themes. */
    .thumb {
      flex: none; width: 42px; height: 56px; border-radius: 9px; object-fit: contain;
      background: #FFFFFF; padding: 3px; display: block;
    }
    .thumb.sm { width: 34px; height: 45px; border-radius: 7px; padding: 2px; }
    .thumb.lg { width: 58px; height: 77px; border-radius: 11px; padding: 4px; }
    .thumb.ph {
      display: grid; place-items: center; padding: 0; font-weight: 600; font-size: 1.05rem;
      background: var(--sunk); color: var(--muted); box-shadow: inset 0 -4px 0 var(--fam, var(--line));
    }
    .with-thumb { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .frag { display: block; color: var(--faint); font-size: .8rem; margin-top: 1px; }
    .frag-map { color: var(--muted); font-size: .88rem; margin-top: 10px; }
    .fine { color: var(--faint); font-size: .82rem; margin-top: 22px; }

    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .back { display: inline-block; color: var(--muted); font-size: .9rem; margin-bottom: 14px; text-decoration: none; }
    .back:hover { color: var(--ink); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <a class="back" href="../">Andrew Reynolds</a>
    <header class="masthead">
      <h1>Sillage</h1>
      <p>Your fragrances sorted onto the wheel, with the best bottle and its best dupe for every family you're missing.</p>
    </header>

    <div class="layout">
      <div class="wheel-col">
        <div class="wheel-wrap">
          <svg id="wheel" viewBox="-200 -200 400 400" role="group" aria-label="Fragrance wheel. Tap a family for recommendations."></svg>
        </div>
        <div class="legend" aria-hidden="true">
          <span><i class="l-have"></i>On your shelf</span>
          <span><i class="l-miss"></i>Missing</span>
        </div>
      </div>

      <div class="side">
        <div id="sheet" hidden></div>
        <div id="lists">
        <section aria-labelledby="missing-title">
          <div class="sec-head"><h2 class="sec" id="missing-title">Missing families</h2></div>
          <div id="missing"></div>
        </section>

        <section aria-labelledby="shelf-title">
          <div class="sec-head"><h2 class="sec" id="shelf-title">Your shelf</h2><span class="count" id="shelf-count"></span></div>
          <div class="add-box">
            <input id="add" type="search" placeholder="Add a bottle you own, like Sauvage or Libre" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search for a fragrance you own" aria-controls="add-results">
            <div id="add-results" hidden></div>
          </div>
          <div id="shelf"></div>
        </section>
        </div>
      </div>
    </div>
  </div>

  <p id="live" class="sr" aria-live="polite"></p>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
